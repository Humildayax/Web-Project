name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela jobs viejos del mismo PR cuando llega un push nuevo: ahorra
# minutos de runner cuando alguien empuja varios commits seguidos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinneado al mismo minor que go.mod. Si subís go.mod, sumá la
          # versión acá también.
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race detecta data races; barato a este tamaño de proyecto.
        # Con cero tests pasa "ok" sin correr nada — sirve como placeholder
        # para cuando se agreguen.
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc
        # `tsc -b` chequea tipos en todos los proyectos referenciados.
        run: npx tsc -b

      - name: vite build
        run: npm run build

  docker:
    # Verifica que los Dockerfiles compilen con los digests pinneados.
    # No publica imágenes; solo build local en el runner.
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # Cache layers entre runs vía GitHub Actions cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
