services:
  db:
    # Pin por digest para builds/deploys reproducibles. Si actualizás el tag,
    # pedí los nuevos SHAs y reemplazá acá y en los Dockerfiles.
    image: postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    container_name: security-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Expuesto al host para inspección con psql/DBeaver.
      # En prod real este puerto se elimina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El schema lo aplica el backend con golang-migrate al arrancar
      # (las migraciones viven en backend/migrations, embebidas en el binario).
      # Por eso este servicio ya no monta init.sql en docker-entrypoint-initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - security-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-backend
    restart: unless-stopped
    environment:
      # DB: dentro de la red de compose, el host es el nombre del servicio.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      # Por default `disable` porque el back y la DB viven en la misma red
      # interna de compose. Si en algún entorno la DB queda fuera (RDS, otro
      # host), seteá DB_SSLMODE=require (o verify-full) en el .env.
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      # HTTP / CORS: en prod el front es mismo origen, CORS no aplica
      # para mismo origen. Igual lo dejamos configurable.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}

      # JIRA (opcional). Si JIRA_ENABLED=false el back usa el cliente noop.
      JIRA_ENABLED: ${JIRA_ENABLED:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - security-network
    # Sin `ports:` -> backend NO se expone al host. Se accede solo
    # desde el contenedor del frontend (vía nginx proxy).

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: security-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - security-network

networks:
  security-network:
    driver: bridge

volumes:
  postgres_data:
