server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo del body (debe ser >= HTTP_MAX_BODY_BYTES del back).
    client_max_body_size 2m;

    # ---- Cache agresivo para assets versionados ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API: proxy interno al backend ----
    # Mismo origen que el front -> sin CORS necesario en prod.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: la creación de incidente puede tardar si JIRA está lento.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---- SPA fallback ----
    # Cualquier ruta que no matchee un archivo cae a index.html
    # para que React Router maneje el routing del lado cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloquear archivos ocultos.
    location ~ /\. {
        deny all;
        return 404;
    }
}
