# No leakear versión de nginx en headers ni páginas de error.
server_tokens off;

# Zona de rate-limit para /api/. 10 req/s sostenido por IP, con burst de 20.
# El backend además aplica un rate-limit propio sobre POST /api/incidents,
# este es la primera línea de defensa contra inundación.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo del body. 30m cubre 5 archivos × 5 MB de adjuntos +
    # margen para los campos de texto. Debe ser >= HTTP_MAX_BODY_BYTES
    # del backend (default 30 MiB).
    client_max_body_size 30m;

    # ---- Cache agresivo para assets versionados ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API: proxy interno al backend ----
    # Mismo origen que el front -> sin CORS necesario en prod.
    location /api/ {
        # Aplica el rate-limit definido arriba. burst=20 absorbe picos cortos
        # sin rechazar; nodelay devuelve 503 cuando se supera el burst.
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: la creación de incidente puede tardar si JIRA está lento.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---- SPA fallback ----
    # Cualquier ruta que no matchee un archivo cae a index.html
    # para que React Router maneje el routing del lado cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Headers de seguridad ----
    # always = se agregan también a respuestas 4xx/5xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP: la SPA solo carga JS/CSS propios, fetch al mismo origen, e iframea
    # /policies.pdf (mismo origen). 'unsafe-inline' en style-src queda porque
    # Vite inyecta estilos críticos inline; quitar requeriría nonces.
    # object-src 'self' es necesario porque algunos navegadores (Chrome) usan
    # <embed>/<object> internamente al renderizar PDFs en iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # HSTS: descomentá cuando tengas TLS terminado delante de nginx.
    # Mandarlo sin HTTPS no rompe pero tampoco aporta y confunde a auditorías.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Bloquear archivos ocultos.
    location ~ /\. {
        deny all;
        return 404;
    }
}
